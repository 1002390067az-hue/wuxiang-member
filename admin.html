<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>无相美学｜会员管理后台 V1</title>
<style>
:root{
  --bg:#f4efe6;--paper:#fbf8f2;--ink:#382f29;--muted:#8e8176;
  --gold:#b79a68;--line:#ddd2c4;--brown:#675245;--wine:#7a4b45;
  --ok:#5f775f;--danger:#9b5c57
}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,#f8f4ed,#efe7dc);color:var(--ink);
font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:26px 18px 60px}
.top{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:22px}
.brand small{letter-spacing:.2em;color:var(--gold);font-size:11px}
.brand h1{font-family:"Songti SC","STSong",serif;font-size:30px;font-weight:500;margin:6px 0}
.brand p{margin:0;color:var(--muted);font-size:12px}
.pill{padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.5);font-size:11px;color:var(--brown)}
.grid{display:grid;grid-template-columns:1.1fr .9fr;gap:14px}
.card{background:rgba(251,248,242,.9);border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:0 12px 28px rgba(82,62,45,.06)}
.card h2{font-family:"Songti SC","STSong",serif;font-weight:500;font-size:19px;margin:0 0 14px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.input,.select{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fffdf9;color:var(--ink);font-size:13px;outline:none}
label{display:block;font-size:11px;color:var(--muted);margin-bottom:6px}
.field{margin-bottom:10px}
.btn{border:0;border-radius:13px;padding:11px 14px;font-size:12px;cursor:pointer}
.btn.primary{background:var(--brown);color:white}
.btn.soft{background:#eee3d4;color:var(--brown)}
.btn.danger{background:#f3e3df;color:var(--danger)}
.btnline{display:flex;gap:8px;flex-wrap:wrap}
.list{display:flex;flex-direction:column;gap:9px}
.member{padding:14px;border:1px solid var(--line);border-radius:16px;background:#fffdf8;cursor:pointer}
.member.active{border-color:#b99c71;background:#fbf3e7}
.member strong{font-family:"Songti SC","STSong",serif;font-size:15px;font-weight:500}
.meta{font-size:10px;color:var(--muted);margin-top:5px;line-height:1.5}
.statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:14px}
.stat{padding:14px;border-radius:16px;background:#fffdf8;border:1px solid var(--line)}
.stat b{font-family:Georgia,serif;font-size:24px;font-weight:400;color:var(--brown)}
.stat span{display:block;font-size:10px;color:var(--muted);margin-top:4px}
.project{padding:13px 0;border-bottom:1px solid var(--line)}
.project:last-child{border-bottom:0}
.projecthead{display:flex;justify-content:space-between;gap:10px}
.projecthead b{font-weight:500;font-size:13px}
.count{font-family:Georgia,serif;color:var(--brown);font-size:12px}
.count strong{font-size:20px;font-weight:400}
.bar{height:3px;border-radius:10px;background:#e8dfd3;margin:9px 0 6px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#9f7d54,#c7ae83)}
.table{width:100%;border-collapse:collapse;font-size:11px}
.table th,.table td{text-align:left;padding:9px 6px;border-bottom:1px solid var(--line)}
.table th{color:var(--muted);font-weight:500}
.note{font-size:10px;color:var(--muted);line-height:1.7;margin-top:10px}
.nfc{font-family:monospace;font-size:11px;padding:11px;border-radius:12px;background:#efe7da;color:#6e5a48;word-break:break-all;margin-top:8px}
@media(max-width:760px){
 .grid{grid-template-columns:1fr}.row{grid-template-columns:1fr}.statgrid{grid-template-columns:1fr 1fr}
 .top{align-items:start;flex-direction:column}.wrap{padding:18px 14px 40px}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand">
      <small>WUXIANG AESTHETICS · ADMIN</small>
      <h1>无相美学｜会员管理后台</h1>
      <p>新增会员 · 绑定卡号 · 添加项目 · 核销次数 · 服务记录</p>
    </div>
    <div class="pill">V1 演示后台 · 本地数据</div>
  </div>

  <div class="statgrid">
    <div class="stat"><b id="statMembers">0</b><span>会员数量</span></div>
    <div class="stat"><b id="statProjects">0</b><span>有效项目</span></div>
    <div class="stat"><b id="statRedeems">0</b><span>累计核销</span></div>
    <div class="stat"><b id="statRecords">0</b><span>服务记录</span></div>
  </div>

  <div class="grid">
    <div>
      <div class="card">
        <h2>会员管理</h2>
        <div class="row">
          <div class="field"><label>会员姓名</label><input id="mName" class="input" placeholder="例如：王女士"></div>
          <div class="field"><label>手机号</label><input id="mPhone" class="input" inputmode="tel" placeholder="13800000000"></div>
          <div class="field"><label>会员等级</label>
            <select id="mLevel" class="select"><option>御龄尊享</option><option>御龄臻享</option><option>御龄典藏</option></select>
          </div>
          <div class="field"><label>卡有效期</label><input id="mExpiry" class="input" type="date"></div>
        </div>
        <div class="btnline"><button class="btn primary" onclick="addMember()">新增会员并生成编号</button><button class="btn soft" onclick="resetDemo()">恢复演示数据</button></div>
        <div class="note">演示规则：新增会员会自动生成 WX 开头的会员编号，并生成专属 NFC 入口。</div>
      </div>

      <div class="card" style="margin-top:14px">
        <h2>会员列表</h2>
        <div id="memberList" class="list"></div>
      </div>
    </div>

    <div>
      <div class="card">
        <h2>当前会员</h2>
        <div id="empty">请先从左侧选择会员。</div>
        <div id="detail" style="display:none">
          <div style="display:flex;justify-content:space-between;gap:10px;align-items:end">
            <div><div id="dName" style="font-family:'Songti SC','STSong',serif;font-size:21px"></div><div id="dMeta" class="meta"></div></div>
            <button class="btn soft" onclick="copyNfc()">复制 NFC 链接</button>
          </div>
          <div id="nfcUrl" class="nfc"></div>

          <h2 style="margin-top:22px">添加项目</h2>
          <div class="row">
            <div class="field"><label>项目名称</label>
              <select id="pName" class="select">
                <option>轻羽注射技术</option><option>光影美学抗衰</option><option>皮肤年轻化管理</option><option>骨相支撑美学</option><option>容量复位</option>
              </select>
            </div>
            <div class="field"><label>总次数</label><input id="pTotal" class="input" type="number" min="1" value="3"></div>
            <div class="field"><label>已使用次数</label><input id="pUsed" class="input" type="number" min="0" value="0"></div>
            <div class="field"><label>下次建议时间</label><input id="pNext" class="input" type="date"></div>
          </div>
          <button class="btn primary" onclick="addProject()">添加到会员项目</button>

          <h2 style="margin-top:22px">项目与核销</h2>
          <div id="projectList"></div>
        </div>
      </div>

      <div class="card" style="margin-top:14px">
        <h2>服务记录</h2>
        <div style="overflow:auto">
          <table class="table">
            <thead><tr><th>日期</th><th>会员</th><th>项目</th><th>操作</th></tr></thead>
            <tbody id="recordBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const KEY='wuxiang_admin_v1';
const demo={
 members:[
  {id:'WX20260018',name:'王女士',phone:'138****6688',level:'御龄尊享',expiry:'2027-08-15'},
  {id:'WX20260032',name:'陈女士',phone:'139****2211',level:'御龄臻享',expiry:'2027-03-01'}
 ],
 projects:[
  {id:'P1',memberId:'WX20260018',name:'轻羽注射技术',total:3,used:1,next:'2026-09-20'},
  {id:'P2',memberId:'WX20260018',name:'光影美学抗衰',total:2,used:1,next:'2026-10-05'},
  {id:'P3',memberId:'WX20260018',name:'皮肤年轻化管理',total:6,used:2,next:'2026-08-28'}
 ],
 records:[
  {date:'2026-07-18',memberId:'WX20260018',memberName:'王女士',project:'轻羽注射技术',action:'核销 1 次'},
  {date:'2026-07-02',memberId:'WX20260018',memberName:'王女士',project:'光影美学抗衰',action:'核销 1 次'}
 ]
};
let state=load(); let selected=state.members[0]?.id||null;

function load(){try{const x=localStorage.getItem(KEY);return x?JSON.parse(x):structuredClone(demo)}catch(e){return structuredClone(demo)}}
function save(){localStorage.setItem(KEY,JSON.stringify(state));render()}
function gid(prefix){return prefix+Math.random().toString(36).slice(2,8).toUpperCase()}
function memberUrl(id){return location.origin+location.pathname.replace(/admin\\.html$/,'')+'index.html?member='+encodeURIComponent(id)}
function addMember(){
 const name=mName.value.trim(); if(!name)return alert('请填写会员姓名');
 const id='WX'+new Date().getFullYear()+String(Math.floor(Math.random()*9000)+1000);
 state.members.push({id,name,phone:mPhone.value.trim()||'未填写',level:mLevel.value,expiry:mExpiry.value||''});
 selected=id; save(); mName.value='';mPhone.value='';
}
function addProject(){
 if(!selected)return;
 const total=Math.max(1,Number(pTotal.value)||1),used=Math.max(0,Number(pUsed.value)||0);
 state.projects.push({id:gid('P'),memberId:selected,name:pName.value,total,used:Math.min(used,total),next:pNext.value||''});
 save();
}
function redeem(id){
 const p=state.projects.find(x=>x.id===id); if(!p||p.used>=p.total)return alert('该项目已无剩余次数');
 p.used++;
 const m=state.members.find(x=>x.id===p.memberId);
 state.records.unshift({date:new Date().toISOString().slice(0,10),memberId:p.memberId,memberName:m?.name||'',project:p.name,action:'核销 1 次'});
 save();
}
function removeProject(id){if(confirm('确定删除这个项目吗？')){state.projects=state.projects.filter(x=>x.id!==id);save()}}
function resetDemo(){if(confirm('恢复演示数据？')){state=structuredClone(demo);selected=state.members[0].id;save()}}
function copyNfc(){navigator.clipboard?.writeText(memberUrl(selected));alert('NFC 专属链接已复制')}
function selectMember(id){selected=id;render()}
function render(){
 statMembers.textContent=state.members.length;
 statProjects.textContent=state.projects.length;
 statRedeems.textContent=state.records.filter(r=>r.action.includes('核销')).length;
 statRecords.textContent=state.records.length;
 memberList.innerHTML=state.members.map(m=>`<div class="member ${m.id===selected?'active':''}" onclick="selectMember('${m.id}')"><strong>${m.name}</strong><div class="meta">${m.id} · ${m.level}<br>${m.phone}</div></div>`).join('');
 const m=state.members.find(x=>x.id===selected);
 if(!m){empty.style.display='block';detail.style.display='none'}else{
  empty.style.display='none';detail.style.display='block';dName.textContent=m.name;dMeta.textContent=`${m.id} · ${m.level} · 有效期 ${m.expiry||'未设置'}`;nfcUrl.textContent=memberUrl(m.id);
  const ps=state.projects.filter(x=>x.memberId===m.id);
  projectList.innerHTML=ps.length?ps.map(p=>{
    const remain=p.total-p.used,percent=Math.round((p.used/p.total)*100);
    return `<div class="project"><div class="projecthead"><b>${p.name}</b><div class="count">剩余 <strong>${remain}</strong> / ${p.total}</div></div><div class="bar"><i style="width:${percent}%"></i></div><div class="meta"><span>已使用 ${p.used} 次</span><span>${p.next?'下次 '+p.next:'未设置下次时间'}</span></div><div class="btnline" style="margin-top:10px"><button class="btn primary" onclick="redeem('${p.id}')">核销 1 次</button><button class="btn danger" onclick="removeProject('${p.id}')">删除项目</button></div></div>`
  }).join(''):'<div class="meta">暂无项目</div>';
 }
 recordBody.innerHTML=state.records.map(r=>`<tr><td>${r.date}</td><td>${r.memberName}</td><td>${r.project}</td><td>${r.action}</td></tr>`).join('');
}
render();
</script>
</body></html>
